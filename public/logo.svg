<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Glowing effect -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </radialGradient>
  </defs>

  <!-- Left block of the 'C' Shield -->
  <path d="M60 10 L25 30 L25 85 L60 110 L60 85 L40 70 L40 45 L60 30 Z" fill="url(#leftGrad)" />
  
  <!-- Right block of the 'C' Shield (shorter to form the C) -->
  <path d="M60 10 L95 30 L95 50 L60 30 Z" fill="url(#rightGrad)" />
  <path d="M60 110 L95 85 L95 65 L60 85 Z" fill="url(#rightGrad)" />
  
  <!-- Center AI Node Gem -->
  <polygon points="60,45 75,55 60,65 45,55" fill="url(#centerGlow)" filter="url(#glow)" />
  
  <!-- Connecting circuit lines -->
  <path d="M60 65 L60 85 M45 55 L25 65 M75 55 L95 65" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
